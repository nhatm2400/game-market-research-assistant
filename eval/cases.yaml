# Bộ kiểm thử chạy thật (cần mạng và GEMINI_API_KEY). Chạy: python -m eval.run_eval
# loai: tot (kỳ vọng làm tốt), kho (dữ liệu không rõ ràng), thieu (thiếu dữ liệu), that_bai (dự đoán làm chưa tốt),
#       tiep (nghiên cứu tiếp từ case khác, giữ bối cảnh), cu (nguồn cũ, số dự báo), cr (Change Request A4)
# checks: điều kiện của Mission 2, giữ nguyên để kiểm regression. checks_m3: điều kiện mới của Mission 3.
# checks_cr: điều kiện của Change Request A4 (khối quyết định nhanh: nên làm gì tiếp, dựa trên bằng chứng nào).
# hoc_duoc: điền sau khi xem kết quả.

- id: TC1
  loai: tot
  question: "Doanh thu IAP game mobile Đông Nam Á quý 1/2025 là bao nhiêu?"
  urls:
    - https://sensortower.com/blog/southeast-asia-mobile-gaming-2025
    - https://gamedevreports.substack.com/p/sensor-tower-southeast-asia-mobile
  use_search: false
  ky_vong: "Giữ được nhận định 625 triệu USD kèm câu trích, nguồn gốc là Sensor Tower"
  checks:
    verified_numbers: ["625"]
    origin_includes: "Sensor Tower"
  checks_m3:
    decision_in: ["Đã có câu trả lời"]
    trusted_includes_numbers: ["625"]
  checks_cr:
    card: true
    card_evidence_numbers_any: ["625"]
  hoc_duoc: "Đạt cả 3/3 lần chạy, cả 3 lần đều 'Đã có câu trả lời' với 625 triệu USD ở 'Có thể tin' (blog Sensor Tower, hạng A, bản gốc), tin cậy Trung bình vì chỉ một nguồn gốc. Nguyên nhân chính so với M2: kế hoạch chỉ còn tiêu chí đúng thứ được hỏi; M2 tự thêm tiêu chí ngoài câu hỏi (top thể loại, top quốc gia), tạo chỗ thiếu giả và kéo kết luận về 'Cần thêm dữ liệu'."

- id: TC2
  loai: kho
  question: "Quy mô thị trường game Đông Nam Á năm 2024 là bao nhiêu và các nguồn có khớp nhau không?"
  urls:
    - https://gamesbeat.com/southeast-asia-to-reach-6-47-billion-in-revenues-by-2029-niko-partners/
    - https://allcorrectgames.com/insights/the-gaming-market-in-southeast-asia-2/
    - https://gamedevreports.substack.com/p/niko-partners-southeast-asia-games
  use_search: false
  ky_vong: "Tìm thấy cả 5,37 tỷ (Niko Partners) và 5,89 tỷ (Statista), báo mâu thuẫn dạng khoảng, không chọn một bên, mức tin cậy không phải Cao; hai bài cùng dẫn Niko chỉ tính là một nguồn gốc"
  checks:
    verified_numbers: ["5.37", "5.89"]
    has_conflict: true
    confidence_not: ["Cao"]
  checks_m3:
    uncertain_reason_any: ["lệch", "trái chiều"]
    trusted_excludes_numbers: ["5.37", "5.89"]
    next_steps_min: 1
  checks_cr:
    card: true
    card_evidence_numbers_any: ["5.37", "5.89", "6.51"]
  hoc_duoc: "Đạt cả 3/3 lần. Cả 3 lần đều gom ba nguồn gốc Niko Partners 5,37, Statista 5,89 và Newzoo 6,51 tỷ USD thành một mâu thuẫn lệch 21%, xếp 'Chưa chắc chắn'; tăng trưởng 5,2% của Niko luôn ở 'Có thể tin'. Việc gom đủ ba số nhờ suy ra đơn vị cho ô bảng không ghi đơn vị (trước đó Newzoo 6,51 nằm nhóm riêng). Cả 3 lần kết luận là 'Có số liệu nhưng chưa chắc chắn': code chỉ giữ kết luận chắc chắn khi đa số lý do dựa trên nhận định có thể tin (trước quy tắc này, một lần AI ghi 'Đã có câu trả lời'). Các lỗi lộ ra khi chạy thử đã sửa và có test: số không ghi USD, ô 'N-6.51' bị đọc thành số âm, giá trị ghi hai con số."

- id: TC3
  loai: kho
  question: "Thể loại game mobile nào tăng trưởng doanh thu nhanh nhất ở Đông Nam Á trong 12 tháng qua?"
  urls:
    - https://investgame.net/news/pdf/southeast-asian-mobile-game-market-insights-2025/
    - https://investgame.net/news/pdf/2026-09-03-socialpetaxgamato_2026_southeast_asia_mobile_game_marketing_report_wp/
  use_search: true
  ky_vong: "Cảnh báo số liệu lệch khung 12 tháng (số theo quý, hoặc quý 1/2025 đã cũ) và cảnh báo bảng Shooter +579,4% là của Việt Nam; không đưa ra kết luận mức tin cậy Cao"
  checks:
    flag_any: ["ngoài khung", "không phải số của cả", "Việt Nam"]
    confidence_not: ["Cao"]
  checks_m3:
    summary_not_empty: true
    uncertain_reason_any: ["ngoài khung", "không phải số của cả", "cần xem lại phạm vi"]
    trusted_excludes_numbers: ["579.4"]
    next_steps_min: 1
  hoc_duoc: "Đạt cả 3/3 lần. Câu tóm tắt có lại (M2 rỗng vì bộ kiểm coi '12 tháng' là số bịa). Cả 3 lần, số Q1 2025 (4X Strategy +17,6%, MOBA +20,1%, MMORPG −17,1%) đều ở 'Chưa chắc chắn' vì ngoài khung 12 tháng; số của nước khác để ở 'ngoài phạm vi'; có bước mở các biểu đồ chưa đọc được. Kết luận: 2 lần 'Cần thêm dữ liệu', 1 lần 'Có số liệu nhưng chưa chắc chắn'. Bảng Việt Nam +579,4% không được trích ra ở các lần chạy này, nên điều kiện không đưa số đó vào mục có thể tin đạt mà không có gì để kiểm."

- id: TC4
  loai: tot
  question: "Có nên phát hành game MOBA trên mobile tại Việt Nam trong 12 tháng tới không?"
  urls: []
  use_search: true
  ky_vong: "Có khuyến nghị kèm ít nhất 2 lý do, mọi lý do gắn mã nhận định đã kiểm; nguồn được xếp ít nhất 2 hạng khác nhau"
  checks:
    min_reasons: 2
    min_distinct_tiers: 2
  checks_m3:
    summary_not_empty: true
    next_steps_min: 1
  checks_cr:
    card: true
  hoc_duoc: "Đạt cả 3/3 lần, cả 3 lần đều 'Cần thêm dữ liệu' vì không có số riêng cho MOBA tại Việt Nam và thiếu dữ liệu về mức cạnh tranh; có bước bấm được để hỏi tiếp. Nguồn tìm được thay đổi giữa các lần (2 đến 4 nguồn lỗi tải), nên số trong ba phần cũng khác nhau: có lần có 329 triệu lượt tải ở 'Có thể tin', có lần chỉ có số từ nguồn hạng C ở 'Chưa chắc chắn'. Số MOBA của Đông Nam Á được để ở 'ngoài phạm vi' thay vì làm lý do như M2."

