- id: TC1
  loai: tot
  question: "Doanh thu IAP game mobile Đông Nam Á quý 1/2025 là bao nhiêu?"
  urls:
    - https://sensortower.com/blog/southeast-asia-mobile-gaming-2025
    - https://gamedevreports.substack.com/p/sensor-tower-southeast-asia-mobile
  use_search: false
  ky_vong: "Giữ được nhận định 625 triệu USD kèm câu trích, nguồn gốc là Sensor Tower"
  checks:
    verified_numbers: ["625"]
    origin_includes: "Sensor Tower"
  checks_m3:
    decision_in: ["Đã có câu trả lời"]
    trusted_includes_numbers: ["625"]
  hoc_duoc: "Đạt. Kế hoạch giờ chỉ có 1 tiêu chí đúng thứ được hỏi; ở M2 AI tự thêm tiêu chí ngoài câu hỏi (top thể loại, top quốc gia), tạo chỗ thiếu giả và kéo kết luận về 'Cần thêm dữ liệu'. Số 625 triệu USD từ blog Sensor Tower (hạng A, bản gốc) nằm ở 'Có thể tin', kết luận 'Đã có câu trả lời', tin cậy Trung bình vì chỉ một nguồn gốc. Ở một lần chạy đủ trước đó (prompt cũ) AI vẫn chọn 'Cần thêm dữ liệu' dù số đã ở mục có thể tin: nhãn kết luận vẫn do AI chọn nên có thể dao động, còn ba phần do code xếp thì ổn định."

- id: TC2
  loai: kho
  question: "Quy mô thị trường game Đông Nam Á năm 2024 là bao nhiêu và các nguồn có khớp nhau không?"
  urls:
    - https://gamesbeat.com/southeast-asia-to-reach-6-47-billion-in-revenues-by-2029-niko-partners/
    - https://allcorrectgames.com/insights/the-gaming-market-in-southeast-asia-2/
    - https://gamedevreports.substack.com/p/niko-partners-southeast-asia-games
  use_search: false
  ky_vong: "Tìm thấy cả 5,37 tỷ (Niko Partners) và 5,89 tỷ (Statista), báo mâu thuẫn dạng khoảng, không chọn một bên, mức tin cậy không phải Cao; hai bài cùng dẫn Niko chỉ tính là một nguồn gốc"
  checks:
    verified_numbers: ["5.37", "5.89"]
    has_conflict: true
    confidence_not: ["Cao"]
  checks_m3:
    uncertain_reason_any: ["lệch", "trái chiều"]
    trusted_excludes_numbers: ["5.37", "5.89"]
    next_steps_min: 1
  hoc_duoc: "Đạt. Ba nguồn gốc độc lập (Niko Partners 5,37; Statista 5,89; Newzoo 6,51 tỷ USD) được gom vào một nhóm mâu thuẫn lệch 21% và xếp 'Chưa chắc chắn'; không con số quy mô nào vào 'Có thể tin'. Bước tiếp là so sánh cách đo của ba hãng; số dự báo 2029 để riêng ở 'ngoài phạm vi'. Hai lỗi lộ ra khi chạy thử M3 đã sửa và có test: một bản sao '5.37 billion' không ghi USD bị tách khỏi nhóm (nay doanh thu không ghi đơn vị được coi là USD, có ghi chú), và ô bảng 'N-6.51' bị đọc thành −6,51 rồi báo nhầm các nguồn trái chiều."

- id: TC3
  loai: kho
  question: "Thể loại game mobile nào tăng trưởng doanh thu nhanh nhất ở Đông Nam Á trong 12 tháng qua?"
  urls:
    - https://investgame.net/news/pdf/southeast-asian-mobile-game-market-insights-2025/
    - https://investgame.net/news/pdf/2026-09-03-socialpetaxgamato_2026_southeast_asia_mobile_game_marketing_report_wp/
  use_search: true
  ky_vong: "Cảnh báo số liệu lệch khung 12 tháng (số theo quý, hoặc quý 1/2025 đã cũ) và cảnh báo bảng Shooter +579,4% là của Việt Nam; không đưa ra kết luận mức tin cậy Cao"
  checks:
    flag_any: ["ngoài khung", "không phải số của cả", "Việt Nam"]
    confidence_not: ["Cao"]
  checks_m3:
    summary_not_empty: true
    uncertain_reason_any: ["ngoài khung", "không phải số của cả", "cần xem lại phạm vi"]
    trusted_excludes_numbers: ["579.4"]
    next_steps_min: 1
  hoc_duoc: "Đạt. Câu tóm tắt có lại (M2 bị rỗng vì bộ kiểm coi '12 tháng' là số bịa). Chỉ có số Q1 2025 (4X Strategy +17,6%, MOBA +20,1%, MMORPG −17,1%) nên cả ba ở 'Chưa chắc chắn' với lý do ngoài khung 12 tháng và là số dẫn lại; số của Indonesia và Thái Lan để ở 'ngoài phạm vi' (lần chạy này không trích bảng Việt Nam +579,4%, nên điều kiện không đưa số đó vào mục có thể tin đạt mà không có gì để kiểm). Bước tiếp gồm tìm số đúng khung và mở biểu đồ InvestGame có 11 con số chưa kiểm được. AI vẫn chọn 'Đã có câu trả lời' kèm tin cậy Thấp: nhãn kết luận còn rộng, người dùng cần đọc cùng mức tin cậy và ba phần."

- id: TC4
  loai: tot
  question: "Có nên phát hành game MOBA trên mobile tại Việt Nam trong 12 tháng tới không?"
  urls: []
  use_search: true
  ky_vong: "Có khuyến nghị kèm ít nhất 2 lý do, mọi lý do gắn mã nhận định đã kiểm; nguồn được xếp ít nhất 2 hạng khác nhau"
  checks:
    min_reasons: 2
    min_distinct_tiers: 2
  checks_m3:
    summary_not_empty: true
    next_steps_min: 1
  hoc_duoc: "Đạt. 'Cần thêm dữ liệu' là hợp lý: số về Việt Nam có thể tin chỉ có 329 triệu lượt tải game mobile Q1 2025; số MOBA chỉ có ở cấp Đông Nam Á nên được để ở 'ngoài phạm vi' thay vì trộn vào lý do như M2. Bước tiếp là tìm dữ liệu về mức cạnh tranh, bấm được để hỏi tiếp. Nguồn đọc được có hạng A, B, D; 2 nguồn lỗi tải."

- id: TC5
  loai: thieu
  question: "Doanh thu tháng 9/2026 của tựa game Tiếu Ngạo tại Việt Nam là bao nhiêu?"
  urls: []
  use_search: true
  ky_vong: "Không có số công khai, nên trả lời Cần thêm dữ liệu và không bịa số"
  checks:
    decision_in: ["Cần thêm dữ liệu"]
    no_verified_number_for_period: "2026-09"
  checks_m3:
    next_steps_min: 1
  hoc_duoc: "Đạt. Không có nhận định nào, mức 'Chưa đủ dữ liệu', không gọi AI viết tóm tắt nên không có chỗ bịa số. Khác M2: kế hoạch chỉ còn 1 tiêu chí đúng câu hỏi, và mục 'Nên tìm hiểu tiếp' có một bước bấm được để nghiên cứu tiếp tiêu chí đó, thay vì một câu khuyên chung."

- id: TC6
  loai: that_bai
  question: "Theo báo cáo Sensor Tower 2025, phân nhánh game mobile nào có doanh thu tăng nhanh nhất ở Đông Nam Á (quý 1/2025 so với quý 4/2024)?"
  urls:
    - https://investgame.net/news/pdf/southeast-asian-mobile-game-market-insights-2025/
  use_search: false
  ky_vong: "Đáp án đúng theo biểu đồ của báo cáo là Battle Royale +37,6%. Dự đoán hệ thống dễ sai ở đây vì số nằm trong biểu đồ, khi đọc ra chữ thì nhãn và số bị xáo trộn"
  checks:
    top_growth_genre: "battle royale"
    verified_numbers: ["37.6"]
  checks_m3:
    top_growth_genre_in_market: "battle royale"
    chart_step: true
  hoc_duoc: "Chưa đạt, đúng như dự đoán. Ở các lần chạy M3, AI có lúc gán đúng +37,6% cho Battle Royale của Đông Nam Á, nhưng câu trích chỉ là con số hoặc là chuỗi ghép nhãn, trục và số không đứng liền nhau trong văn bản, nên code không kiểm được và loại; có lần AI ghép +37,6% với Match Swap (sai) và cũng bị loại. Chỉ còn số của Indonesia và Thái Lan nên không có đáp án cho Đông Nam Á. Cải tiến M3: không còn đạt nhầm (điều kiện mới chỉ xét số của Đông Nam Á; điều kiện cũ vẫn đạt nhầm nhờ số +50% của Indonesia), và có bước mở thẳng tới biểu đồ có 22 con số chưa kiểm được. Muốn đạt cần đọc biểu đồ theo bố cục trang hoặc bằng mô hình thị giác. TC6 được chạy lại riêng sau khi thêm bước chỉ tới biểu đồ khi nhãn bị ghép với số."

- id: TC7
  loai: tiep
  question: "Còn riêng Việt Nam thì sao? (hỏi tiếp từ TC2)"
  parent: TC2
  follow_up: "Còn riêng Việt Nam thì sao?"
  urls: []
  use_search: false
  ky_vong: "Hiểu câu hỏi tiếp là quy mô thị trường game Việt Nam năm 2024 (giữ chỉ số và năm của TC2, chỉ đổi thị trường), giữ toàn bộ nhận định đã kiểm của TC2 mà không đọc lại nguồn, và trả lời bằng số của Việt Nam đã có trong bối cảnh (0,817 tỷ USD theo Newzoo)"
  checks: {}
  checks_m3:
    question_market: "Việt Nam"
    window_label: "01/2024 đến 12/2024"
    context_kept: true
    llm_calls_max: 10
    verified_numbers: ["0.817"]
  hoc_duoc: "Đạt. 'Còn riêng Việt Nam thì sao?' được viết lại thành 'Quy mô thị trường game Việt Nam năm 2024 là bao nhiêu và các nguồn có khớp nhau không?' (giữ chỉ số, năm và ý so sánh nguồn, chỉ đổi thị trường). Giữ 7/7 nhận định của TC2, đọc lại 3 nguồn đã lưu với câu hỏi mới (không tải lại) và tìm ra 0,817 tỷ USD (Newzoo) cùng 0,46 tỷ USD (Statista); hai nguồn lệch 78% nên xếp 'Chưa chắc chắn'. 6 lượt gọi LLM. Bản đầu tiên không đọc lại nguồn đã hụt số này vì lần đọc đầu của TC2 không trích dòng Việt Nam, nên đã đổi thành đọc lại nguồn khi hỏi tiếp."

