    no_verified_number_for_period: "2026-09"
  checks_m3:
    next_steps_min: 1
  checks_cr:
    card: true
  hoc_duoc: "Đạt cả 3/3 lần: không có nhận định nào, mức 'Chưa đủ dữ liệu', không gọi AI viết tóm tắt nên không có chỗ bịa số. Khác M2: kế hoạch chỉ còn tiêu chí đúng câu hỏi, và mục 'Nên tìm hiểu tiếp' có bước bấm được để nghiên cứu tiếp tiêu chí đó thay vì một câu khuyên chung."

- id: TC6
  loai: that_bai
  question: "Theo báo cáo Sensor Tower 2025, phân nhánh game mobile nào có doanh thu tăng nhanh nhất ở Đông Nam Á (quý 1/2025 so với quý 4/2024)?"
  urls:
    - https://investgame.net/news/pdf/southeast-asian-mobile-game-market-insights-2025/
  use_search: false
  ky_vong: "Đáp án đúng theo biểu đồ của báo cáo là Battle Royale +37,6%. Dự đoán hệ thống dễ sai ở đây vì số nằm trong biểu đồ, khi đọc ra chữ thì nhãn và số bị xáo trộn"
  checks:
    top_growth_genre: "battle royale"
    verified_numbers: ["37.6"]
  checks_m3:
    top_growth_genre_in_market: "battle royale"
    chart_step: true
  hoc_duoc: "Chưa đạt cả 3/3 lần, đúng như dự đoán. Cả 3 lần AI đều gán đúng +37,6% cho Battle Royale của Đông Nam Á, nhưng câu trích là chuỗi ghép từ nhãn, trục và số không đứng liền nhau trong văn bản biểu đồ, nên code không tìm thấy và loại; số +37,6% của FPS / 3PS ở Philippines (cũng đúng) bị loại vì câu trích chỉ có con số. Code không kiểm được cặp nhãn và số trong biểu đồ, nên chọn loại thay vì cho qua; có lần chạy trước AI ghép +37,6% với Match Swap (sai) và cũng bị loại. Điều kiện cũ của M2 vẫn 'đạt nhầm' nhờ số +50% của Indonesia; điều kiện mới chỉ xét số Đông Nam Á nên báo đúng. Cải tiến M3: có bước mở thẳng tới biểu đồ chưa đọc được. Muốn đạt cần đọc biểu đồ theo bố cục trang hoặc bằng mô hình thị giác."

- id: TC7
  loai: tiep
  question: "Còn riêng Việt Nam thì sao? (hỏi tiếp từ TC2)"
  parent: TC2
  follow_up: "Còn riêng Việt Nam thì sao?"
  urls: []
  use_search: false
  ky_vong: "Hiểu câu hỏi tiếp là quy mô thị trường game Việt Nam năm 2024 (giữ chỉ số và năm của TC2, chỉ đổi thị trường), giữ toàn bộ nhận định đã kiểm của TC2 mà không tải lại nguồn từ mạng, và trả lời bằng số của Việt Nam đã có trong bối cảnh (0,817 tỷ USD theo Newzoo)"
  checks: {}
  checks_m3:
    question_market: "Việt Nam"
    window_label: "01/2024 đến 12/2024"
    context_kept: true
    llm_calls_max: 10
    verified_numbers: ["0.817"]
  hoc_duoc: "Đạt cả 3/3 lần. 'Còn riêng Việt Nam thì sao?' luôn được viết lại thành 'Quy mô thị trường game Việt Nam năm 2024 là bao nhiêu và các nguồn có khớp nhau không?' (giữ chỉ số, năm và ý so sánh nguồn, chỉ đổi thị trường), giữ toàn bộ nhận định của TC2, đọc lại nguồn đã lưu với câu hỏi mới (không tải lại), tìm ra 0,46 tỷ USD (Statista) và 0,817 tỷ USD (Newzoo) lệch 78%, kết luận do code đặt là 'Có số liệu nhưng chưa chắc chắn'. Bộ kiểm có lần loại lý do vì AI tự đổi 0,46 tỷ thành '460 triệu USD'. Bản đầu tiên không đọc lại nguồn đã hụt số này vì lần đọc đầu của TC2 không trích dòng Việt Nam."

- id: TC8
  loai: cu
  question: "Quy mô thị trường game Đông Nam Á năm 2025 là bao nhiêu?"
  urls:
    - https://gamesbeat.com/southeast-asia-to-reach-6-47-billion-in-revenues-by-2029-niko-partners/
    - https://gamedevreports.substack.com/p/niko-partners-southeast-asia-games
  use_search: false
  ky_vong: "Số 2025 duy nhất (5,47 tỷ USD) là dự báo của Niko Partners trong bài đăng tháng 9 và 10/2025, khi năm 2025 chưa kết thúc. Hệ thống phải xếp số này vào mục chưa chắc chắn với lý do là số ước tính hoặc dự báo, không đưa vào mục có thể tin, không cho mức tin cậy Cao, và gợi ý tìm số đã đo"
  checks: {}
  checks_m3:
    uncertain_includes_numbers: ["5.47"]
    trusted_excludes_numbers: ["5.47"]
    uncertain_reason_any: ["chưa kết thúc", "dự báo"]
    confidence_not: ["Cao"]
    next_steps_min: 1
  checks_cr:
    card: true
    card_evidence_numbers_any: ["5.47"]
  hoc_duoc: "Đạt cả 3/3 lần. Số 2025 duy nhất là 5,47 tỷ USD của Niko Partners trong bài đăng tháng 9 và 10/2025; code nhận ra năm 2025 chưa kết thúc lúc đăng nên xếp 'Chưa chắc chắn' (số ước tính hoặc dự báo), tin cậy Thấp, và cả 3 lần kết luận là 'Có số liệu nhưng chưa chắc chắn' (code đổi từ 'Đã có câu trả lời' AI viết, vì không lý do nào dựa trên nhận định có thể tin). Bước tiếp: tìm số đã đo của năm 2025. M2 không có quy tắc này (chỉ cảnh báo số lệch khung của câu hỏi), nên với câu hỏi về năm 2025 sẽ đưa 5,47 tỷ như số đã đo; điều này suy ra từ quy tắc M2, M2 chưa được chạy trên TC8."

- id: TC9
  loai: cr
  question: "Nên ưu tiên phát hành game MOBA hay game chiến thuật 4X tại Đông Nam Á, dựa trên tăng trưởng doanh thu quý 1/2025?"
  urls:
    - https://sensortower.com/blog/southeast-asia-mobile-gaming-2025
    - https://gamedevreports.substack.com/p/sensor-tower-southeast-asia-mobile
  use_search: false
  ky_vong: "Change Request A4: người dùng không đọc báo cáo dài. Đầu kết quả phải có khối quyết định nhanh: một câu nên làm gì tiếp và bước tiếp theo, dựa trên tối đa 3 bằng chứng đã kiểm, mỗi bằng chứng mở được câu trích; bằng chứng phải là số tăng trưởng doanh thu theo thể loại của Sensor Tower (MOBA +20,1%, 4X +17,6%)"
  checks: {}
  checks_cr:
    card: true
    card_evidence_min: 1
    card_evidence_numbers_any: ["20.1", "17.6"]
  hoc_duoc: "Đạt cả 3/3 lần chạy thật. Lần nào khối quyết định nhanh cũng có đúng 3 bằng chứng đã kiểm, mỗi bằng chứng mở được câu trích: 625 triệu USD (Sensor Tower, hạng A), MOBA +20,1% và 4X Strategy +17,6% (Sensor Tower dẫn qua GameDev Reports, hạng B). 2 lần AI kết luận 'Nên ưu tiên' và câu nên làm gì tiếp là câu cụ thể (ví dụ 'Ưu tiên phát hành game MOBA; cần đối chiếu thêm báo cáo gốc của Sensor Tower trước khi chốt đầu tư'); 1 lần AI chọn 'Cần thêm dữ liệu' nên khối dùng câu hành động của code kèm bước tiếp theo. Hạn chế: so MOBA với 4X chỉ dựa trên tăng trưởng một quý của một nguồn gốc; khối thể hiện điều đó bằng mức tin cậy Trung bình và bước đối chiếu bản gốc Sensor Tower."