  hoc_duoc: "Đạt. Số 2025 duy nhất là 5,47 tỷ USD của Niko Partners trong bài đăng tháng 9 và 10/2025; code nhận ra năm 2025 chưa kết thúc lúc đăng nên xếp 'Chưa chắc chắn' (số ước tính hoặc dự báo), tin cậy Thấp, bước tiếp là tìm số đã đo của năm 2025 và đối chiếu bản gốc Niko Partners. M2 không có cảnh báo này nên sẽ đưa 5,47 tỷ như số đã đo."

