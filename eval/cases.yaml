- id: TC1
  loai: tot
  question: "Doanh thu IAP game mobile Đông Nam Á quý 1/2025 là bao nhiêu?"
  urls:
    - https://sensortower.com/blog/southeast-asia-mobile-gaming-2025
    - https://gamedevreports.substack.com/p/sensor-tower-southeast-asia-mobile
  use_search: false
  ky_vong: "Giữ được nhận định 625 triệu USD kèm câu trích, nguồn gốc là Sensor Tower"
  checks:
    verified_numbers: ["625"]
    origin_includes: "Sensor Tower"
  checks_m3:
    decision_in: ["Đã có câu trả lời"]
    trusted_includes_numbers: ["625"]
  hoc_duoc: "Đạt. Kế hoạch chỉ còn 1 tiêu chí đúng thứ được hỏi; ở M2 AI tự thêm tiêu chí ngoài câu hỏi (top thể loại, top quốc gia), tạo chỗ thiếu giả và kéo kết luận về 'Cần thêm dữ liệu'. Số 625 triệu USD từ blog Sensor Tower (hạng A, bản gốc) và từ bài dẫn lại đều ở 'Có thể tin'; kết luận 'Đã có câu trả lời', tin cậy Trung bình vì chỉ một nguồn gốc; bước tiếp là đối chiếu bản gốc Sensor Tower cho bài dẫn lại. Ở một lần chạy với prompt cũ, AI vẫn chọn 'Cần thêm dữ liệu' dù số đã ở mục có thể tin: nhãn kết luận do AI chọn nên có thể dao động, còn ba phần do code xếp thì ổn định."

- id: TC2
  loai: kho
  question: "Quy mô thị trường game Đông Nam Á năm 2024 là bao nhiêu và các nguồn có khớp nhau không?"
  urls:
    - https://gamesbeat.com/southeast-asia-to-reach-6-47-billion-in-revenues-by-2029-niko-partners/
    - https://allcorrectgames.com/insights/the-gaming-market-in-southeast-asia-2/
    - https://gamedevreports.substack.com/p/niko-partners-southeast-asia-games
  use_search: false
  ky_vong: "Tìm thấy cả 5,37 tỷ (Niko Partners) và 5,89 tỷ (Statista), báo mâu thuẫn dạng khoảng, không chọn một bên, mức tin cậy không phải Cao; hai bài cùng dẫn Niko chỉ tính là một nguồn gốc"
  checks:
    verified_numbers: ["5.37", "5.89"]
    has_conflict: true
    confidence_not: ["Cao"]
  checks_m3:
    uncertain_reason_any: ["lệch", "trái chiều"]
    trusted_excludes_numbers: ["5.37", "5.89"]
    next_steps_min: 1
  hoc_duoc: "Đạt. Hai mâu thuẫn được xếp 'Chưa chắc chắn': Niko Partners 5,37 và Statista 5,89 tỷ USD lệch 10%; Statista 5,89 và Newzoo 6,51 (đọc từ bảng không ghi đơn vị) lệch 11%. Không con số quy mô nào vào 'Có thể tin', chỉ có tăng trưởng 5,2% của Niko. Kết luận 'Đã có câu trả lời', tin cậy Thấp, tóm tắt nêu khoảng 5,37 đến 6,51 tỷ USD. Hạn chế: số trong bảng không ghi 'billion' nên không vào chung một nhóm với số có đơn vị. Các lỗi lộ ra khi chạy thử M3 đã sửa và có test: số '5.37 billion' không ghi USD, ô bảng 'N-6.51' bị đọc thành số âm, giá trị ghi hai con số."

- id: TC3
  loai: kho
  question: "Thể loại game mobile nào tăng trưởng doanh thu nhanh nhất ở Đông Nam Á trong 12 tháng qua?"
  urls:
    - https://investgame.net/news/pdf/southeast-asian-mobile-game-market-insights-2025/
    - https://investgame.net/news/pdf/2026-09-03-socialpetaxgamato_2026_southeast_asia_mobile_game_marketing_report_wp/
  use_search: true
  ky_vong: "Cảnh báo số liệu lệch khung 12 tháng (số theo quý, hoặc quý 1/2025 đã cũ) và cảnh báo bảng Shooter +579,4% là của Việt Nam; không đưa ra kết luận mức tin cậy Cao"
  checks:
    flag_any: ["ngoài khung", "không phải số của cả", "Việt Nam"]
    confidence_not: ["Cao"]
  checks_m3:
    summary_not_empty: true
    uncertain_reason_any: ["ngoài khung", "không phải số của cả", "cần xem lại phạm vi"]
    trusted_excludes_numbers: ["579.4"]
    next_steps_min: 1
  hoc_duoc: "Đạt. Câu tóm tắt có lại (M2 bị rỗng vì bộ kiểm coi '12 tháng' là số bịa). Chỉ có số Q1 2025 (MOBA +20,1%, 4X Strategy +17,6%, MMORPG −17,1%) nên cả ba ở 'Chưa chắc chắn' với lý do ngoài khung 12 tháng; 34 nhóm số của thị trường hoặc kỳ khác để ở 'ngoài phạm vi'. Bước tiếp gồm tìm số đúng khung và mở các biểu đồ chưa đọc được (14 con số trên trang InvestGame, các trang 12, 19, 21 của một PDF). Lần chạy này không trích bảng Việt Nam +579,4% nên điều kiện không đưa số đó vào mục có thể tin đạt mà không có gì để kiểm."

- id: TC4
  loai: tot
  question: "Có nên phát hành game MOBA trên mobile tại Việt Nam trong 12 tháng tới không?"
  urls: []
  use_search: true
  ky_vong: "Có khuyến nghị kèm ít nhất 2 lý do, mọi lý do gắn mã nhận định đã kiểm; nguồn được xếp ít nhất 2 hạng khác nhau"
  checks:
    min_reasons: 2
    min_distinct_tiers: 2
  checks_m3:
    summary_not_empty: true
    next_steps_min: 1
  hoc_duoc: "Đạt. 'Cần thêm dữ liệu' là hợp lý. Có thể tin: 329 triệu lượt tải Q1 2025 và tăng trưởng lượt tải 12% của Việt Nam. Chưa chắc chắn: doanh thu 1,8 tỷ USD và tăng trưởng 33% (chỉ có nguồn hạng C), tăng trưởng 2024–2027 (một phần là dự báo). Chưa có dữ liệu về mức cạnh tranh trong nhóm MOBA, có bước bấm được để hỏi tiếp. Mỗi lý do trong bản tóm tắt có dấu cho biết dựa trên nhận định có thể tin hay chưa chắc chắn."

- id: TC5
  loai: thieu
  question: "Doanh thu tháng 9/2026 của tựa game Tiếu Ngạo tại Việt Nam là bao nhiêu?"
  urls: []
  use_search: true
  ky_vong: "Không có số công khai, nên trả lời Cần thêm dữ liệu và không bịa số"
  checks:
    decision_in: ["Cần thêm dữ liệu"]
    no_verified_number_for_period: "2026-09"
  checks_m3:
    next_steps_min: 1
  hoc_duoc: "Đạt. Không có nhận định nào, mức 'Chưa đủ dữ liệu', không gọi AI viết tóm tắt nên không có chỗ bịa số. Khác M2: kế hoạch chỉ còn 1 tiêu chí đúng câu hỏi, và mục 'Nên tìm hiểu tiếp' có một bước bấm được để nghiên cứu tiếp tiêu chí đó, thay vì một câu khuyên chung."

- id: TC6
  loai: that_bai
  question: "Theo báo cáo Sensor Tower 2025, phân nhánh game mobile nào có doanh thu tăng nhanh nhất ở Đông Nam Á (quý 1/2025 so với quý 4/2024)?"
  urls:
    - https://investgame.net/news/pdf/southeast-asian-mobile-game-market-insights-2025/
  use_search: false
  ky_vong: "Đáp án đúng theo biểu đồ của báo cáo là Battle Royale +37,6%. Dự đoán hệ thống dễ sai ở đây vì số nằm trong biểu đồ, khi đọc ra chữ thì nhãn và số bị xáo trộn"
  checks:
    top_growth_genre: "battle royale"
    verified_numbers: ["37.6"]
  checks_m3:
    top_growth_genre_in_market: "battle royale"
    chart_step: true
  hoc_duoc: "Chưa đạt, đúng như dự đoán. Lần chạy cuối không giữ được nhận định nào (0/22): câu trích bị ghép từ nhãn, trục và số của biểu đồ nên không có nguyên văn trong nguồn; trong đó +37,6% bị gán cho Squad RPG (sai, đúng là Battle Royale) và bị loại. Ở lần chạy khác AI có lúc gán đúng Battle Royale nhưng câu trích chỉ là con số nên cũng bị loại. Điều kiện cũ của M2 từng đạt nhầm nhờ số +50% của Indonesia, nay báo đúng là không đạt; vì vậy tổng điều kiện M2 của bản M3 là 19/21 chứ không phải 20/21. Cải tiến M3: có bước mở thẳng tới biểu đồ có 22 con số chưa kiểm được. Muốn đạt cần đọc biểu đồ theo bố cục trang hoặc bằng mô hình thị giác."

- id: TC7
  loai: tiep
  question: "Còn riêng Việt Nam thì sao? (hỏi tiếp từ TC2)"
  parent: TC2
  follow_up: "Còn riêng Việt Nam thì sao?"
  urls: []
  use_search: false
  ky_vong: "Hiểu câu hỏi tiếp là quy mô thị trường game Việt Nam năm 2024 (giữ chỉ số và năm của TC2, chỉ đổi thị trường), giữ toàn bộ nhận định đã kiểm của TC2 mà không đọc lại nguồn, và trả lời bằng số của Việt Nam đã có trong bối cảnh (0,817 tỷ USD theo Newzoo)"
  checks: {}
  checks_m3:
    question_market: "Việt Nam"
    window_label: "01/2024 đến 12/2024"
    context_kept: true
    llm_calls_max: 10
    verified_numbers: ["0.817"]
  hoc_duoc: "Đạt. 'Còn riêng Việt Nam thì sao?' được viết lại thành 'Quy mô thị trường game Việt Nam năm 2024 là bao nhiêu và các nguồn có khớp nhau không?' (giữ chỉ số, năm và ý so sánh nguồn, chỉ đổi thị trường). Giữ 7/7 nhận định của TC2, đọc lại 3 nguồn đã lưu với câu hỏi mới (không tải lại), tìm ra 0,817 tỷ USD (Newzoo) và 0,46 tỷ USD (Statista) lệch 78%. Bộ kiểm loại 2 lý do vì AI tự đổi 0,46 tỷ thành '460 triệu USD' (số không có trong nhận định), và code đổi kết luận 'Đã có câu trả lời' thành 'Có số liệu nhưng chưa chắc chắn' vì không lý do nào dựa trên nhận định có thể tin. 6 lượt gọi LLM. Bản đầu tiên không đọc lại nguồn đã hụt số này vì lần đọc đầu của TC2 không trích dòng Việt Nam."

- id: TC8
  loai: cu
  question: "Quy mô thị trường game Đông Nam Á năm 2025 là bao nhiêu?"
  urls:
    - https://gamesbeat.com/southeast-asia-to-reach-6-47-billion-in-revenues-by-2029-niko-partners/
    - https://gamedevreports.substack.com/p/niko-partners-southeast-asia-games
  use_search: false
  ky_vong: "Số 2025 duy nhất (5,47 tỷ USD) là dự báo của Niko Partners trong bài đăng tháng 9 và 10/2025, khi năm 2025 chưa kết thúc. Hệ thống phải xếp số này vào mục chưa chắc chắn với lý do là số ước tính hoặc dự báo, không đưa vào mục có thể tin, không cho mức tin cậy Cao, và gợi ý tìm số đã đo"
  checks: {}
  checks_m3:
    uncertain_includes_numbers: ["5.47"]
    trusted_excludes_numbers: ["5.47"]
    uncertain_reason_any: ["chưa kết thúc", "dự báo"]
    confidence_not: ["Cao"]
    next_steps_min: 1
  hoc_duoc: "Đạt. Số 2025 duy nhất là 5,47 tỷ USD của Niko Partners trong bài đăng tháng 9 và 10/2025. Code nhận ra năm 2025 chưa kết thúc lúc đăng nên xếp 'Chưa chắc chắn' (số ước tính hoặc dự báo), tin cậy Thấp, và đổi kết luận AI viết ('Đã có câu trả lời') thành 'Có số liệu nhưng chưa chắc chắn' vì không lý do nào dựa trên nhận định có thể tin. Bước tiếp: tìm số đã đo của năm 2025 và đối chiếu bản gốc Niko Partners. M2 không có cảnh báo này nên sẽ đưa 5,47 tỷ như số đã đo."

